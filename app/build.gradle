plugins {
    id 'com.android.application'
}

android {
    namespace 'com.litetv.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.litetv.app"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Sin dependencias a propósito: el APK queda diminuto y no gasta RAM de más.
